name: Sync to Hugging Face Hub

# Change this if you rename your Space (e.g. owner/your-space-name)
env:
  HF_REPO_ID: baidi-prob/rag-chatbot

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Verify HF token is present
        shell: bash
        run: |
          if [ -z "${{ secrets.HF_TOKEN }}" ]; then
            echo "::error::HF_TOKEN secret is missing. Add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "HF_TOKEN is set (length ${#HF_TOKEN})."

      - name: Validate token and HF account
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set +e
          echo "=== Validating HF token (hf whoami) ==="
          WHOAMI_OUT="$(uvx hf whoami 2>&1)"
          WHOAMI_CODE=$?
          echo "$WHOAMI_OUT"
          if [ $WHOAMI_CODE -ne 0 ]; then
            echo ""
            echo "=========================================================="
            echo "TOKEN VALIDATION FAILED (exit code $WHOAMI_CODE)."
            echo "The raw error from the hf CLI is shown above."
            echo ""
            echo "Most likely causes:"
            echo "  1. The token is expired or was regenerated -> create a NEW one"
            echo "  2. It lacks 'write' scope -> regenerate with write access"
            echo "  3. It is a fine-grained token without repo access"
            echo ""
            echo "Fix: go to huggingface.co -> Settings -> Access tokens ->"
            echo "New token, scope = 'write', then update the HF_TOKEN secret."
            echo "=========================================================="
            exit 1
          fi
          echo "Token is valid. Account info: $WHOAMI_OUT"

      - name: Create or update Hugging Face Space
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          echo "=== Creating/updating Space: ${HF_REPO_ID} ==="
          # Capture stderr so we can surface the real reason for failure.
          CREATE_OUT="$(uvx hf repos create "${HF_REPO_ID}" --type space --exist-ok --space-sdk streamlit 2>&1)" \
            || { echo "::error::Space creation failed. Output:"; echo "$CREATE_OUT"; exit 1; }
          echo "$CREATE_OUT"
          echo "=== Space ready ==="

      - name: Upload files to Hugging Face Space
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          echo "=== Uploading repo files to ${HF_REPO_ID} ==="
          uvx hf upload \
            "${HF_REPO_ID}" \
            . \
            --type space \
            --exclude=".git*" \
            --exclude=".github*" \
            --delete="*" \
            --commit-message="Sync from ${{ github.repository }} via CI"
          echo "=== Upload complete ==="
          echo "View your Space at: https://huggingface.co/spaces/${HF_REPO_ID}"